<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Foot Locker - Formulaire</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <img src="images/logo.png" alt="Foot Locker" class="logo-img" />
      </header>

        <!-- Card Body -->

      <div class="card-body">
        <h2>CONGRATS</h2>

            <!-- Form Frame -->

        <div class="form-frame">
          <form
            class="form-container"
            id="claim-form"
            onsubmit="event.preventDefault(); alert('Success!'); window.location.href='index.html';"
          >
            <input type="text" placeholder="First name :" required />
            <input type="text" placeholder="Name :" required />
            <input type="email" placeholder="Mail :" required />
            <input type="tel" placeholder="Tel :" required />
          </form>
        </div>

        <button type="submit" form="claim-form" class="btn-claim">CLAIM</button>
      </div>
    </div>
  </body>
</html>
